<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RT-Skynet Apps</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; color: #1d1d1f; }
        header { background: #fff; padding: 24px 40px; border-bottom: 1px solid #e5e5e5; }
        header h1 { font-size: 22px; font-weight: 600; }
        header p { color: #6e6e73; font-size: 14px; margin-top: 4px; }
        .apps { max-width: 720px; margin: 48px auto; padding: 0 24px; }
        .app-card { background: #fff; border-radius: 16px; padding: 28px; margin-bottom: 20px; display: flex; align-items: center; gap: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .app-icon { width: 64px; height: 64px; border-radius: 14px; background: linear-gradient(135deg, #34c759, #248a3d); display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
        .app-info h2 { font-size: 18px; font-weight: 600; }
        .app-info p { color: #6e6e73; font-size: 14px; margin-top: 4px; }
        .app-info a { display: inline-block; margin-top: 10px; font-size: 13px; color: #0071e3; text-decoration: none; }
        .app-info a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <h1>RT-Skynet Apps</h1>
        <p>iOS apps built with passion.</p>
    </header>
    <div class="apps">
        <div class="app-card">
            <div class="app-icon">🥗</div>
            <div class="app-info">
                <h2>CaloScan</h2>
                <p>AI-powered calorie tracking. Scan, photograph or search your food.</p>
                <a href="/caloscan/privacy.html">Privacy Policy</a>
            </div>
        </div>
    </div>
</body>
</html>
